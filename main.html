<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>SparkDo - Main To Do List</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed-variant": "#4c463b",
                        "tertiary": "#586062",
                        "primary-container": "#ff8c00",
                        "surface-container-lowest": "#ffffff",
                        "inverse-primary": "#ffb77d",
                        "on-surface-variant": "#564334",
                        "surface-variant": "#e1e3e4",
                        "outline-variant": "#ddc1ae",
                        "inverse-on-surface": "#f0f1f2",
                        "on-error-container": "#93000a",
                        "on-error": "#ffffff",
                        "surface-bright": "#f8f9fa",
                        "on-primary-fixed-variant": "#6e3900",
                        "on-secondary": "#ffffff",
                        "on-primary-container": "#623200",
                        "on-tertiary-fixed-variant": "#41484a",
                        "secondary": "#645e52",
                        "primary": "#904d00",
                        "tertiary-fixed-dim": "#c1c8ca",
                        "outline": "#897362",
                        "secondary-container": "#e8ded0",
                        "tertiary-fixed": "#dde4e6",
                        "surface-tint": "#904d00",
                        "inverse-surface": "#2e3132",
                        "on-secondary-container": "#686256",
                        "background": "#f8f9fa",
                        "on-secondary-fixed": "#1f1b12",
                        "error": "#ba1a1a",
                        "secondary-fixed-dim": "#cec5b7",
                        "secondary-fixed": "#ebe1d3",
                        "error-container": "#ffdad6",
                        "primary-fixed-dim": "#ffb77d",
                        "on-tertiary": "#ffffff",
                        "surface-container-low": "#f3f4f5",
                        "on-surface": "#191c1d",
                        "surface-container-high": "#e7e8e9",
                        "surface-container": "#edeeef",
                        "on-tertiary-fixed": "#161d1f",
                        "on-primary": "#ffffff",
                        "on-background": "#191c1d",
                        "surface-dim": "#d9dadb",
                        "tertiary-container": "#a4abad",
                        "on-tertiary-container": "#394042",
                        "surface-container-highest": "#e1e3e4",
                        "surface": "#f8f9fa",
                        "on-primary-fixed": "#2f1500",
                        "primary-fixed": "#ffdcc3"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "24px",
                        "lg": "48px",
                        "xs": "4px",
                        "base": "8px",
                        "gutter": "24px",
                        "sm": "12px",
                        "container-max": "1120px",
                        "xl": "80px"
                    },
                    "fontFamily": {
                        "display": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "label-sm": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "label-bold": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "display": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "label-bold": ["14px", { "lineHeight": "20px", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }]
                    }
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .icon-fill {
            font-variation-settings: 'FILL' 1;
        }

        .task-card-shadow {
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.04);
        }


        .bg-pattern {
            background-image: radial-gradient(#ffb77d 1px, transparent 1px);
            background-size: 24px 24px;
            background-position: -12px -12px;
        }

        .fade-in-up {
            animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="text-on-background min-h-screen flex flex-col relative overflow-x-hidden"
    style="background: radial-gradient(circle at 15% 25%, rgba(255, 140, 0, 0.15) 0%, transparent 50%), radial-gradient(circle at 85% 75%, rgba(255, 140, 0, 0.12) 0%, transparent 60%), rgb(248, 249, 250);">
    <!-- TopAppBar -->
    <header class="bg-surface dark:bg-background docked full-width top-0 shadow-sm z-40 relative">
        <div class="grid grid-cols-12 items-center px-gutter w-full h-16 max-w-container-max mx-auto">
            <div class="col-span-12 flex justify-center relative h-full items-center">
                <span
                    class="font-display text-headline-lg-mobile md:text-headline-lg text-primary dark:text-primary-fixed-dim tracking-tight">SparkDo</span>
                <button
                    class="absolute right-0 text-primary dark:text-primary-fixed-dim hover:opacity-80 transition-opacity p-2 rounded-full hover:bg-surface-container md:text-headline-lg"
                    id="profile-btn"><img alt="Alex Spark" class="w-8 h-8 md:w-10 md:h-10 rounded-full object-cover"
                        src="https://lh3.googleusercontent.com/aida/AEtjO1VCYMQbCkme1KRmxG1SyLnqrGp1Hyt9LlL4TW4Rpwpq9_4HoKrKJd5zcVTIBQnMRTNFgXRhx2B6HBhgPu56J_ThrYF5XOLqPF9fm4RVinV7AMOKFz7gM-wfmvFNSZ-rWn0GurPd2myRyWCwNEuffZt87XtngzBcYeNMm_ZgnsKI2KqJcYi9377QX0dy8zOw8ff3XcIl6_Esm3294CgsjNuUzVjqfE3i3eMWv0aC5SvpFX1tTh14nZOy7X0"></button>
            </div>
        </div>
    </header>
    <!-- SideNavBar (Hidden by default, overlays from right) -->
    <div class="fixed inset-y-0 right-0 w-64 bg-surface-container-low dark:bg-inverse-surface shadow-xl z-50 transform transition-transform duration-300 ease-in-out flex flex-col h-full p-md translate-x-full"
        id="side-nav">
        <div class="flex justify-between items-center mb-lg mt-12">
            <div class="flex items-center gap-sm">
                <img class="w-12 h-12 rounded-full object-cover"
                    data-alt="A stylized, modern geometric avatar illustration of a user named Alex Spark. Vibrant orange and warm grey tones. Clean vector art style. Light mode aesthetic."
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuD7_r6YX1WfdUC2xigB5b2bzSYMg4K-ZxZvfrMBu1xrg2yhjs9u4IBINLoCLfLM6vN0NlH0LQTFwY4cYUzfGgaZ3f8y8iNZppi1AGmUIr0V-MWIVzkBhCz9pZxu0Qlj54mPYI5Zrhi9f5BLZUd7gBKqBkL7Pz5fmiOIxOzO9BnbRcAURMJiPolklaskjjWYyYKYe4FOFd03HKkUusH_kaWN3gO2gDtKbHqCVIPGFkIGa9_yX8JZi658">
                <div>
                    <h3 class="font-headline-md text-body-md text-on-surface">Alex Spark</h3>
                </div>
            </div>
            <button class="text-on-surface-variant hover:bg-surface-variant p-2 rounded-full transition-colors"
                id="close-nav">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <nav class="flex-grow space-y-sm"><a
                class="flex items-center gap-sm text-on-surface-variant dark:text-surface-variant hover:bg-secondary-container dark:hover:bg-secondary transition-colors rounded-lg font-label-bold px-4 py-3"
                href="#">
                <span class="material-symbols-outlined" data-icon="description">description</span>
                下書き
            </a>
            <a class="flex items-center gap-sm text-on-surface-variant dark:text-surface-variant hover:bg-secondary-container dark:hover:bg-secondary transition-colors rounded-lg font-label-bold px-4 py-3"
                href="trash.html">
                <span class="material-symbols-outlined" data-icon="delete">delete</span>
                ゴミ箱
            </a>
            <a class="flex items-center gap-sm text-on-surface-variant dark:text-surface-variant hover:bg-secondary-container dark:hover:bg-secondary transition-colors rounded-lg font-label-bold px-4 py-3"
                href="#">
                <span class="material-symbols-outlined" data-icon="settings">settings</span>
                設定
            </a>
        </nav>
        <div class="mt-auto">
            <button id="logout-btn"
                class="w-full flex items-center gap-sm text-on-surface-variant hover:bg-error-container hover:text-on-error-container transition-colors rounded-lg font-label-bold px-4 py-3 text-left">
                <span class="material-symbols-outlined" data-icon="logout">logout</span>
                ログアウト
            </button>
        </div>
    </div>
    <!-- Overlay for SideNav -->
    <div class="fixed inset-0 bg-black/20 z-40 backdrop-blur-sm transition-opacity hidden" id="nav-overlay"></div>
    <!-- Main Content Canvas -->
    <main
        class="flex-grow w-full max-w-container-max mx-auto px-4 md:px-xl py-lg md:py-xl flex flex-col gap-md relative">
        <!-- Welcome / Status area -->
        <section class="flex justify-between items-end mb-lg">
            <div>
                <h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-1"
                    id="encouragement-message"></h1>
            </div>
        </section>
        <!-- Task List Bento Grid Area -->
        <section class="grid grid-cols-1 md:grid-cols-12 gap-md"><!-- Incomplete Tasks Column -->
            <div id="task-list-container" class="md:col-span-6 flex flex-col gap-sm">
                <h2 class="font-label-bold text-label-bold text-on-surface-variant uppercase tracking-wider mb-2">
                    未完了のタスク</h2>
                <!-- High Priority Task (Red/Rose) -->
                <article
                    class="bg-[#FFF0F0] rounded-lg p-4 flex items-center gap-4 task-card-shadow relative overflow-hidden hover:opacity-90 transition-colors border-l-4 border-l-error hover:scale-[1.02] cursor-pointer task-card">
                    <div>
                        <span class="material-symbols-outlined text-tertiary task-icon">crown</span>
                    </div>
                    <div class="flex-grow">
                        <span class="font-body-lg text-body-lg text-on-surface font-semibold block task-title">第3四半期マーケティングプレゼンの仕上げ</span>
                    </div>
                    <button class="ml-auto text-on-surface-variant hover:bg-surface-variant p-1 rounded-full transition-colors flex-shrink-0 flex items-center justify-center">
                        <span class="material-symbols-outlined">more_vert</span>
                    </button>
                </article>
                <!-- Medium Priority Task (Yellow/Amber) -->
                <article
                    class="bg-[#FFF9E6] rounded-lg p-4 flex items-center gap-4 task-card-shadow relative overflow-hidden hover:opacity-90 transition-colors border-l-4 border-l-primary-container hover:scale-[1.02] cursor-pointer task-card">
                    <div>
                        <span class="material-symbols-outlined text-tertiary task-icon">crown</span>
                    </div>
                    <div class="flex-grow">
                        <span class="font-body-lg text-body-lg text-on-surface font-semibold block task-title">デンバーサミットの航空券予約</span>
                    </div>
                    <button class="ml-auto text-on-surface-variant hover:bg-surface-variant p-1 rounded-full transition-colors flex-shrink-0 flex items-center justify-center">
                        <span class="material-symbols-outlined">more_vert</span>
                    </button>
                </article>
                <!-- Low Priority Task (Green) -->
                <article
                    class="bg-[#F0FFF4] rounded-lg p-4 flex items-center gap-4 task-card-shadow relative overflow-hidden hover:opacity-90 transition-colors border-l-4 border-l-secondary-fixed-dim hover:scale-[1.02] cursor-pointer task-card">
                    <div>
                        <span class="material-symbols-outlined text-tertiary task-icon">crown</span>
                    </div>
                    <div class="flex-grow">
                        <span class="font-body-lg text-body-lg text-on-surface font-semibold block task-title">チームランチの場所予約</span>
                    </div>
                    <button class="ml-auto text-on-surface-variant hover:bg-surface-variant p-1 rounded-full transition-colors flex-shrink-0 flex items-center justify-center">
                        <span class="material-symbols-outlined">more_vert</span>
                    </button>
                </article>
            </div>
            <!-- Completed Tasks Column -->
            <div class="md:col-span-6 flex flex-col gap-sm">
                <h2 class="font-label-bold text-label-bold text-on-surface-variant uppercase tracking-wider mb-2">完了済み
                </h2>
                <!-- Task Card 3 (Completed) -->
                <article class="bg-surface-container rounded-lg p-4 flex items-center gap-4 opacity-75 cursor-pointer task-card completed">
                    <div>
                        <span class="material-symbols-outlined text-error icon-fill task-icon">crown</span>
                    </div>
                    <div class="flex-grow">
                        <span class="font-body-lg text-body-lg text-tertiary font-semibold line-through block task-title">週次アップデートメールの送信</span>
                    </div>
                    <button class="ml-auto text-on-surface-variant hover:bg-surface-variant p-1 rounded-full transition-colors flex-shrink-0 flex items-center justify-center">
                        <span class="material-symbols-outlined">more_vert</span>
                    </button>
                </article>
            </div>
        </section>
        <!-- Persistent FAB for Mobile (and Desktop fallback) -->
        <button id="add-task-fab"
            class="fixed bottom-24 md:bottom-8 right-6 md:right-xl w-14 h-14 bg-primary text-on-primary rounded-full shadow-lg flex items-center justify-center hover:scale-110 hover:bg-surface-tint transition-transform duration-200 z-30">
            <span class="material-symbols-outlined" data-icon="add">add</span>
        </button>
    </main>
    <!-- BottomNavBar (Mobile Only) -->
    <nav
        class="bg-surface dark:bg-inverse-surface docked full-width bottom-0 rounded-t-xl shadow-[0_-4px_20px_0_rgba(0,0,0,0.04)] fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-3 pb-safe md:hidden">
        <a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 active:scale-110 transition-transform duration-200"
            href="#">
            <span class="material-symbols-outlined icon-fill" data-icon="list_alt">list_alt</span>
            <span class="font-label-sm text-label-sm mt-1">Tasks</span>
        </a>
        <a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant hover:text-primary dark:hover:text-primary-fixed-dim transition-colors"
            href="#">
            <span class="material-symbols-outlined" data-icon="trending_up">trending_up</span>
            <span class="font-label-sm text-label-sm mt-1">Progress</span>
        </a>
        <a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant hover:text-primary dark:hover:text-primary-fixed-dim transition-colors"
            href="#">
            <span class="material-symbols-outlined" data-icon="timer">timer</span>
            <span class="font-label-sm text-label-sm mt-1">Focus</span>
        </a>
        <a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant hover:text-primary dark:hover:text-primary-fixed-dim transition-colors"
            href="#">
            <span class="material-symbols-outlined" data-icon="person">person</span>
            <span class="font-label-sm text-label-sm mt-1">Profile</span>
        </a>
    </nav>

    <script>
        // 5つのランダム文章
        const encouragementMessages = [
            "小さな1歩が、大きな変化をつくります。今日もスタートしよう！",
            "未来の自分が感謝する『今日』にしよう。",
            "準備はOK？リストを1つずつクリアしていきましょう！",
            "完璧を目指さなくて大丈夫。まずは目の前の1つから！",
            "今日の挑戦が、あなたの力になる。素晴らしい1日を！"
        ];

        document.addEventListener("DOMContentLoaded", () => {
            const messageEl = document.getElementById('encouragement-message');
            if (messageEl) {
                const randomIndex = Math.floor(Math.random() * encouragementMessages.length);
                messageEl.textContent = encouragementMessages[randomIndex];
            }
        });

    </script>
    <!-- Logout Confirmation Modal -->
    <div id="logout-modal" class="fixed inset-0 z-[60] flex items-center justify-center hidden">
        <!-- Backdrop Overlay -->
        <div id="logout-overlay" class="fixed inset-0 bg-black/40 backdrop-blur-sm transition-opacity">
            <div class="absolute inset-0 bg-pattern opacity-[0.15]"></div>
        </div>

        <!-- Modal Dialog Content -->
        <main class="relative z-10 w-full max-w-md px-gutter mx-4">
            <div
                class="bg-surface-container-lowest rounded-xl p-lg shadow-lg text-center fade-in-up border border-surface-variant/50">
                <h1 class="font-display text-on-surface font-bold text-xl md:text-2xl tracking-tight mt-md mb-lg">
                    ログアウトしますか？
                </h1>

                <button id="logout-confirm-btn"
                    class="w-full bg-primary text-on-primary font-label-bold text-label-bold py-4 px-6 rounded-lg shadow-md hover:bg-surface-tint hover:shadow-lg transition-all duration-300 transform hover:scale-[1.02] flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined"
                        style="font-variation-settings: 'FILL' 0;">logout</span>ログアウト
                    <button id="logout-cancel-btn"
                        class="w-full mt-md bg-surface-container text-on-surface font-label-bold text-label-bold py-4 px-6 rounded-lg hover:bg-surface-container-high transition-all duration-300 flex items-center justify-center">キャンセル</button>
            </div>
        </main>
    </div>
    </div>

    <!-- New Task Modal (Hidden by default) -->
    <div id="new-task-modal" class="fixed inset-0 z-[60] flex items-center justify-center hidden">
        <!-- Backdrop Overlay -->
        <div id="new-task-overlay" class="fixed inset-0 bg-black/40 backdrop-blur-sm transition-opacity">
            <div class="absolute inset-0 bg-pattern opacity-[0.15]"></div>
        </div>
        <!-- Modal Content -->
        <div class="relative z-10 bg-surface-container-lowest w-full max-w-2xl rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.04)] p-8 overflow-hidden transition-all duration-300 mx-4">
            <!-- Left priority indicator -->
            <div class="absolute left-0 top-0 bottom-0 w-1 bg-primary"></div>
            <div class="mb-8">
                <h2 class="font-headline-md text-headline-md text-on-surface mb-2">新規タスク</h2>
            </div>
            <form id="new-task-form" class="space-y-6">
                <!-- Task Name -->
                <div>
                    <label class="block font-label-bold text-label-bold text-on-surface mb-2" for="taskName">タスク名</label>
                    <div class="flex items-center gap-3">
                        <input class="flex-grow h-12 px-4 rounded-md border border-outline-variant bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow placeholder:text-on-surface-variant/50 font-body-md text-body-md" id="taskName" placeholder="例：プロジェクトの進捗確認" type="text" required />
                        <button aria-label="Toggle priority" class="w-8 h-8 rounded-full bg-green-500 flex-shrink-0 transition-colors duration-300" id="priorityBtn" type="button"></button>
                    </div>
                </div>
                <!-- Content -->
                <div>
                    <label class="block font-label-bold text-label-bold text-on-surface mb-2" for="taskContent">内容</label>
                    <textarea class="w-full p-4 rounded-md border border-outline-variant bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow placeholder:text-on-surface-variant/50 font-body-md text-body-md resize-y" id="taskContent" placeholder="タスクの詳細を記入してください..." rows="5"></textarea>
                </div>
                <!-- Action Buttons -->
                <div class="flex flex-col sm:flex-row justify-end items-center pt-6 gap-4 border-t border-surface-variant">
                    <button id="cancel-task-btn" class="w-full sm:w-auto px-6 py-3 rounded-full border-2 border-primary text-primary font-label-bold text-label-bold hover:bg-primary/5 active:scale-95 transition-all duration-200" type="button">
                        キャンセル
                    </button>
                    <button class="w-full sm:w-auto px-6 py-3 rounded-full bg-secondary-container text-on-secondary-container font-label-bold text-label-bold hover:bg-secondary-fixed active:scale-95 transition-all duration-200" type="button">
                        下書き保存
                    </button>
                    <button class="w-full sm:w-auto px-8 py-3 rounded-full bg-primary text-on-primary font-label-bold text-label-bold hover:bg-surface-tint shadow-md hover:shadow-lg active:scale-95 transition-all duration-200 flex items-center justify-center gap-2" type="submit">
                        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add_task</span>
                        追加
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>

</html>
