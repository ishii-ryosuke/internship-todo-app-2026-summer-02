<!DOCTYPE html>
<html class="light" lang="en">

<head>

                        "on-primary-fixed-variant": "#6e3900",

                        "on-primary-container": "#623200",
                        "on-tertiary-fixed-variant": "#41484a",
                        "secondary": "#645e52",
                        "primary": "#904d00",
                        "tertiary-fixed-dim": "#c1c8ca",
                        "outline": "#897362",
                        "secondary-container": "#e8ded0",
                        "tertiary-fixed": "#dde4e6",
                        "surface-tint": "#904d00",

                    "spacing": {

                        "lg": "48px",

                        "base": "8px",
                        "gutter": "24px",

                        "container-max": "1120px",
                        "xl": "80px"
                    },
                    "fontFamily": {
                        "display": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "label-sm": ["Plus Jakarta Sans"],

                        "headline-lg": ["Plus Jakarta Sans"],

                    },

                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .icon-fill {
            font-variation-settings: 'FILL' 1;
        }

        .task-card-shadow {
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.04);
        }


        .bg-pattern {
            background-image: radial-gradient(#ffb77d 1px, transparent 1px);
            background-size: 24px 24px;
            background-position: -12px -12px;
        }

        .fade-in-up {
            animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Custom Scrollbar */
        * {
            scrollbar-width: thin;
            scrollbar-color: #904d00 transparent;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background-color: #904d00;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background-color: #ff8c00;
        }
    </style>
</head>

<body class="text-on-background h-screen flex flex-col relative overflow-hidden"
    style="background: radial-gradient(circle at 15% 25%, rgba(255, 140, 0, 0.15) 0%, transparent 50%), radial-gradient(circle at 85% 75%, rgba(255, 140, 0, 0.12) 0%, transparent 60%), rgb(248, 249, 250);">
    <!-- TopAppBar -->
    <header class="bg-surface dark:bg-background shadow-sm z-40 flex-shrink-0">
        <div class="grid grid-cols-12 items-center px-gutter w-full h-16 max-w-container-max mx-auto">
            <div class="col-span-12 flex justify-center relative h-full items-center">
                <span
                    class="font-display text-headline-lg-mobile md:text-headline-lg text-primary dark:text-primary-fixed-dim tracking-tight"><span style="font-family: 'Yuji Syuku', serif;">威風</span><span style="font-family: 'Yusei Magic', sans-serif;">とぅどぅ</span></span>
                <button
                    class="absolute right-0 text-primary dark:text-primary-fixed-dim hover:opacity-80 transition-opacity p-2 rounded-full hover:bg-surface-container md:text-headline-lg"
                    id="profile-btn">
                    <div id="header-user-icon" class="w-8 h-8 md:w-10 md:h-10 rounded-full bg-primary text-on-primary flex items-center justify-center font-bold text-lg md:text-xl">
                    </div>
                </button>
            </div>
        </div>
    </header>
    <!-- SideNavBar (Hidden by default, overlays from right) -->
    <div class="fixed inset-y-0 right-0 w-64 bg-surface-container-low dark:bg-inverse-surface shadow-xl z-50 transform transition-transform duration-300 ease-in-out flex flex-col h-full p-md translate-x-full"
        id="side-nav">
        <div class="flex justify-between items-center mb-lg mt-12">
            <div class="flex items-center gap-sm">
                <div id="sidebar-user-icon" class="w-12 h-12 rounded-full bg-primary text-on-primary flex items-center justify-center font-bold text-2xl">
                </div>
                <div>
                    <h3 id="sidebar-user-name" class="font-headline-md text-body-md text-on-surface">Alex Spark</h3>
                </div>
            </div>
            <button class="text-on-surface-variant hover:bg-surface-variant p-2 rounded-full transition-colors"
                id="close-nav">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <nav class="flex-grow space-y-sm"><a
                class="flex items-center gap-sm text-on-surface-variant dark:text-surface-variant hover:bg-secondary-container dark:hover:bg-secondary transition-colors rounded-lg font-label-bold px-4 py-3"
                href="draft.html">
                <span class="material-symbols-outlined" data-icon="description">description</span>
                下書き
            </a>
            <a class="flex items-center gap-sm text-on-surface-variant dark:text-surface-variant hover:bg-secondary-container dark:hover:bg-secondary transition-colors rounded-lg font-label-bold px-4 py-3"
                href="trash.html">
                <span class="material-symbols-outlined" data-icon="delete">delete</span>
                ゴミ箱
            </a>
            <a class="flex items-center gap-sm text-on-surface-variant dark:text-surface-variant hover:bg-secondary-container dark:hover:bg-secondary transition-colors rounded-lg font-label-bold px-4 py-3"
                href="#" id="settings-btn">
                <span class="material-symbols-outlined" data-icon="settings">settings</span>
                設定
            </a>
        </nav>
        <div class="mt-auto">
            <button id="logout-btn"
                class="w-full flex items-center gap-sm text-on-surface-variant hover:bg-error-container hover:text-on-error-container transition-colors rounded-lg font-label-bold px-4 py-3 text-left">
                <span class="material-symbols-outlined" data-icon="logout">logout</span>
                ログアウト
            </button>
        </div>
    </div>
    <!-- Overlay for SideNav -->
    <div class="fixed inset-0 bg-black/20 z-40 backdrop-blur-sm transition-opacity hidden" id="nav-overlay"></div>
    <!-- Main Content Canvas -->
    <main
        class="flex-1 min-h-0 w-full max-w-container-max mx-auto px-4 md:px-xl flex flex-col relative">
        <!-- Welcome / Status area -->
        <section class="flex justify-between items-end pt-lg md:pt-xl pb-md flex-shrink-0">
            <div>
                <h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-1"
                    id="encouragement-message"></h1>
            </div>
        </section>
        <!-- Task List Bento Grid Area -->
        <section class="flex-1 min-h-0 grid grid-cols-1 md:grid-cols-12 gap-md pb-lg md:pb-xl"><!-- Incomplete Tasks Column -->
            <div id="task-list-container" class="md:col-span-6 flex flex-col gap-sm overflow-y-auto overflow-x-hidden max-h-[45vh] md:max-h-none min-h-0 pr-1">
                <h2 class="font-label-bold text-label-bold text-on-surface-variant uppercase tracking-wider mb-2 flex-shrink-0">
                    未完了のタスク</h2>
                <!-- 動的に未完了タスクがここに追加されます -->
            </div>
            <!-- Completed Tasks Column -->
            <div id="completed-task-list-container" class="md:col-span-6 flex flex-col gap-sm overflow-y-auto overflow-x-hidden max-h-[45vh] md:max-h-none min-h-0 pr-1">
                <h2 class="font-label-bold text-label-bold text-on-surface-variant uppercase tracking-wider mb-2 flex-shrink-0">完了済み
                </h2>
                <!-- 動的に完了済みタスクがここに追加されます -->
            </div>
        </section>
        <!-- Persistent FAB for Mobile (and Desktop fallback) -->
        <button id="add-task-fab"
            class="fixed bottom-24 md:bottom-8 right-6 md:right-xl w-14 h-14 bg-primary text-on-primary rounded-full shadow-lg flex items-center justify-center hover:scale-110 hover:bg-surface-tint transition-transform duration-200 z-30">
            <span class="material-symbols-outlined" data-icon="add">add</span>
        </button>
    </main>
    <!-- BottomNavBar (Mobile Only) -->
    <nav
        class="bg-surface dark:bg-inverse-surface docked full-width bottom-0 rounded-t-xl shadow-[0_-4px_20px_0_rgba(0,0,0,0.04)] fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-3 pb-safe md:hidden">
        <a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 active:scale-110 transition-transform duration-200"
            href="#">
            <span class="material-symbols-outlined icon-fill" data-icon="list_alt">list_alt</span>
            <span class="font-label-sm text-label-sm mt-1">Tasks</span>
        </a>
        <a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant hover:text-primary dark:hover:text-primary-fixed-dim transition-colors"
            href="#">
            <span class="material-symbols-outlined" data-icon="trending_up">trending_up</span>
            <span class="font-label-sm text-label-sm mt-1">Progress</span>
        </a>
        <a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant hover:text-primary dark:hover:text-primary-fixed-dim transition-colors"
            href="#">
            <span class="material-symbols-outlined" data-icon="timer">timer</span>
            <span class="font-label-sm text-label-sm mt-1">Focus</span>
        </a>
        <a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant hover:text-primary dark:hover:text-primary-fixed-dim transition-colors"
            href="#">
            <span class="material-symbols-outlined" data-icon="person">person</span>
            <span class="font-label-sm text-label-sm mt-1">Profile</span>
        </a>
    </nav>

    <script>
        // 5つのランダム文章
        const encouragementMessages = [
            "小さな1歩が、大きな変化をつくります。今日もスタートしよう！",
            "未来の自分が感謝する『今日』にしよう。",
            "準備はOK？リストを1つずつクリアしていきましょう！",
            "完璧を目指さなくて大丈夫。まずは目の前の1つから！",
            "今日の挑戦が、あなたの力になる。素晴らしい1日を！"
        ];

        document.addEventListener("DOMContentLoaded", () => {
            const messageEl = document.getElementById('encouragement-message');
            if (messageEl) {
                const randomIndex = Math.floor(Math.random() * encouragementMessages.length);
                messageEl.textContent = encouragementMessages[randomIndex];
            }
        });

    </script>
    <!-- Logout Confirmation Modal -->
    <div id="logout-modal" class="fixed inset-0 z-[60] flex items-center justify-center hidden">
        <!-- Backdrop Overlay -->
        <div id="logout-overlay" class="fixed inset-0 bg-black/40 backdrop-blur-sm transition-opacity">
            <div class="absolute inset-0 bg-pattern opacity-[0.15]"></div>
        </div>

        <!-- Modal Dialog Content -->
        <main class="relative z-10 w-full max-w-md px-gutter mx-4">
            <div
                class="bg-surface-container-lowest rounded-xl p-lg shadow-lg text-center fade-in-up border border-surface-variant/50">
                <h1 class="font-display text-on-surface font-bold text-xl md:text-2xl tracking-tight mt-md mb-lg">
                    ログアウトしますか？
                </h1>

                <button id="logout-confirm-btn"
                    class="w-full bg-primary text-on-primary font-label-bold text-label-bold py-4 px-6 rounded-lg shadow-md hover:bg-surface-tint hover:shadow-lg transition-all duration-300 transform hover:scale-[1.02] flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined"
                        style="font-variation-settings: 'FILL' 0;">logout</span>ログアウト
                    <button id="logout-cancel-btn"
                        class="w-full mt-md bg-surface-container text-on-surface font-label-bold text-label-bold py-4 px-6 rounded-lg hover:bg-surface-container-high transition-all duration-300 flex items-center justify-center">キャンセル</button>
            </div>
        </main>
    </div>
    </div>

    <!-- Task Details Modal (Hidden by default) -->
    <div id="task-details-modal" class="fixed inset-0 z-[60] flex items-center justify-center hidden">
        <!-- Backdrop Overlay -->
        <div id="task-details-overlay" class="fixed inset-0 bg-black/40 backdrop-blur-sm transition-opacity">
            <div class="absolute inset-0 bg-pattern opacity-[0.15]"></div>
        </div>
        <!-- Modal Content -->
        <div id="task-details-modal-content"
            class="relative z-10 bg-surface-container-lowest w-full max-w-2xl rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.04)] p-8 overflow-hidden transition-all duration-300 mx-4">
            <!-- Left priority indicator -->
            <div id="task-details-priority-indicator" class="absolute left-0 top-0 bottom-0 w-1 bg-secondary-fixed-dim">
            </div>

            <div class="flex justify-between items-start mb-6">
                <div>
                    <h2 id="task-details-title" class="font-headline-md text-headline-md text-on-surface mb-2 break-all" style="overflow-wrap: anywhere;">タスク名</h2>
                    <p id="task-details-date" class="font-label-sm text-label-sm text-on-surface-variant"></p>
                </div>
                <button id="close-task-details-btn"
                    class="text-on-surface-variant hover:bg-surface-variant p-2 rounded-full transition-colors flex-shrink-0 flex items-center justify-center">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>

            <div class="space-y-6">
                <!-- Content -->
                <div>
                    <h3 class="font-label-bold text-label-bold text-on-surface mb-2">内容</h3>
                    <div id="task-details-content"
                        class="p-4 rounded-md bg-surface-container-low text-on-surface font-body-md text-body-md min-h-[100px] whitespace-pre-wrap break-all"
                        style="overflow-wrap: anywhere;">
                        タスクの詳細内容がここに表示されます。
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- New Task Modal (Hidden by default) -->
    <div id="new-task-modal" class="fixed inset-0 z-[60] flex items-center justify-center hidden">
        <!-- Backdrop Overlay -->
        <div id="new-task-overlay" class="fixed inset-0 bg-black/40 backdrop-blur-sm transition-opacity">
            <div class="absolute inset-0 bg-pattern opacity-[0.15]"></div>
        </div>
        <!-- Modal Content -->
        <div
            class="relative z-10 bg-surface-container-lowest w-full max-w-2xl rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.04)] p-8 overflow-hidden transition-all duration-300 mx-4">
            <!-- Left priority indicator -->
            <div class="absolute left-0 top-0 bottom-0 w-1 bg-primary"></div>
            <div class="mb-8">
                <h2 class="font-headline-md text-headline-md text-on-surface mb-2">新規タスク</h2>
            </div>
            <form id="new-task-form" class="space-y-6">
                <!-- Due Date, Tag & Priority -->
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label class="font-label-bold text-label-bold text-on-surface" for="taskDueDate">
                            <span class="material-symbols-outlined text-[18px] align-middle mr-1">calendar_today</span>
                            期限
                        </label>
                        <div class="flex items-center gap-3">
                            <span class="font-label-bold text-label-bold text-on-surface-variant text-xs">タグ</span>
                            <span class="font-label-bold text-label-bold text-on-surface-variant">優先度</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <input
                            class="flex-grow h-12 px-4 rounded-md border border-outline-variant bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow font-body-md text-body-md"
                            id="taskDueDate" type="date" />
                        <button aria-label="Toggle tag"
                            class="h-8 px-3 rounded-full bg-surface-variant border border-outline-variant flex-shrink-0 transition-colors duration-300 text-[10px] font-bold text-on-surface-variant hover:bg-surface-container"
                            id="tagBtn" type="button">就活</button>
                        <button aria-label="Toggle priority"
                            class="w-8 h-8 rounded-full bg-green-500 flex-shrink-0 transition-colors duration-300 text-[10px] font-bold text-[#FFFFFF]"
                            id="priorityBtn" type="button">低</button>
                    </div>
                </div>
                <!-- Task Name -->
                <div>
                    <label class="block font-label-bold text-label-bold text-on-surface mb-2" for="taskName">タスク名</label>
                    <input
                        class="w-full h-12 px-4 rounded-md border border-outline-variant bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow placeholder:text-on-surface-variant/50 font-body-md text-body-md"
                        id="taskName" placeholder="例：プロジェクトの進捗確認" type="text" required />
                </div>
                <!-- Content -->
                <div>
                    <label class="block font-label-bold text-label-bold text-on-surface mb-2"
                        for="taskContent">内容</label>
                    <textarea
                        class="w-full p-4 rounded-md border border-outline-variant bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow placeholder:text-on-surface-variant/50 font-body-md text-body-md resize-y"
                        id="taskContent" placeholder="タスクの詳細を記入してください..." rows="5"></textarea>
                </div>
                <!-- Action Buttons -->
                <div
                    class="flex flex-col sm:flex-row justify-end items-center pt-6 gap-4 border-t border-surface-variant">
                    <button id="cancel-task-btn"
                        class="w-full sm:w-auto px-6 py-3 rounded-full border-2 border-primary text-primary font-label-bold text-label-bold hover:bg-primary/5 active:scale-95 transition-all duration-200"
                        type="button">
                        キャンセル
                    </button>
                    <button id="draft-task-btn"
                        class="w-full sm:w-auto px-6 py-3 rounded-full bg-secondary-container text-on-secondary-container font-label-bold text-label-bold hover:bg-secondary-fixed active:scale-95 transition-all duration-200"
                        type="button">
                        下書き保存
                    </button>
                    <button
                        class="w-full sm:w-auto px-8 py-3 rounded-full bg-primary text-on-primary font-label-bold text-label-bold hover:bg-surface-tint shadow-md hover:shadow-lg active:scale-95 transition-all duration-200 flex items-center justify-center gap-2"
                        type="submit">
                        <span class="material-symbols-outlined"
                            style="font-variation-settings: 'FILL' 1;">add_task</span>
                        追加
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Task Modal (Hidden by default) -->
    <div id="edit-task-modal" class="fixed inset-0 z-[60] flex items-center justify-center hidden">
        <!-- Backdrop Overlay -->
        <div id="edit-task-overlay" class="fixed inset-0 bg-black/40 backdrop-blur-sm transition-opacity">
            <div class="absolute inset-0 bg-pattern opacity-[0.15]"></div>
        </div>
        <!-- Modal Content -->
        <div
            class="relative z-10 bg-surface-container-lowest w-full max-w-2xl rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.04)] p-8 overflow-hidden transition-all duration-300 mx-4">
            <!-- Left priority indicator -->
            <div class="absolute left-0 top-0 bottom-0 w-1 bg-primary"></div>
            <div class="mb-8">
                <h2 class="font-headline-md text-headline-md text-on-surface mb-2">タスクの編集</h2>
            </div>
            <form id="edit-task-form" class="space-y-6">
                <!-- Due Date, Tag & Priority -->
                <div>
                    <div class="flex justify-between items-end mb-2">
                        <label class="block font-label-bold text-label-bold text-on-surface" for="editTaskDueDate">
                            <span class="material-symbols-outlined text-[18px] align-middle mr-1">calendar_today</span>
                            期限
                        </label>
                        <div class="flex items-center gap-3">
                            <label class="block font-label-bold text-label-sm text-on-surface-variant text-xs" for="editTagBtn">タグ</label>
                            <label class="block font-label-bold text-label-sm text-on-surface"
                                for="editPriorityBtn">優先度</label>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <input
                            class="flex-grow h-12 px-4 rounded-md border border-outline-variant bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow font-body-md text-body-md"
                            id="editTaskDueDate" type="date" />
                        <button aria-label="Toggle tag"
                            class="h-8 px-3 rounded-full bg-surface-variant border border-outline-variant flex-shrink-0 transition-colors duration-300 text-[10px] font-bold text-on-surface-variant hover:bg-surface-container"
                            id="editTagBtn" type="button">その他</button>
                        <button aria-label="Toggle priority"
                            class="w-8 h-8 rounded-full bg-green-500 flex-shrink-0 transition-colors duration-300 text-[10px] font-bold text-[#FFFFFF]"
                            id="editPriorityBtn" type="button">低</button>
                    </div>
                </div>
                <!-- Task Name -->
                <div>
                    <label class="block font-label-bold text-label-bold text-on-surface mb-2"
                        for="editTaskName">タスク名</label>
                    <input
                        class="w-full h-12 px-4 rounded-md border border-outline-variant bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow placeholder:text-on-surface-variant/50 font-body-md text-body-md"
                        id="editTaskName" placeholder="例：プロジェクトの進捗確認" type="text" required />
                </div>
                <!-- Content -->
                <div>
                    <label class="block font-label-bold text-label-bold text-on-surface mb-2"
                        for="editTaskContent">内容</label>
                    <textarea
                        class="w-full p-4 rounded-md border border-outline-variant bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow placeholder:text-on-surface-variant/50 font-body-md text-body-md resize-y"
                        id="editTaskContent" placeholder="タスクの詳細を記入してください..." rows="5"></textarea>
                </div>
                <!-- Action Buttons -->
                <div
                    class="flex flex-col sm:flex-row justify-end items-center pt-6 gap-4 border-t border-surface-variant">
                    <button id="cancel-edit-btn"
                        class="w-full sm:w-auto px-6 py-3 rounded-full border-2 border-primary text-primary font-label-bold text-label-bold hover:bg-primary/5 active:scale-95 transition-all duration-200"
                        type="button">
                        キャンセル
                    </button>
                    <button id="draft-edit-btn"
                        class="w-full sm:w-auto px-6 py-3 rounded-full bg-secondary-container text-on-secondary-container font-label-bold text-label-bold hover:bg-secondary-fixed active:scale-95 transition-all duration-200"
                        type="button">
                        下書き保存
                    </button>
                    <button
                        class="w-full sm:w-auto px-8 py-3 rounded-full bg-primary text-on-primary font-label-bold text-label-bold hover:bg-surface-tint shadow-md hover:shadow-lg active:scale-95 transition-all duration-200 flex items-center justify-center gap-2"
                        type="submit">
                        <span class="material-symbols-outlined"
                            style="font-variation-settings: 'FILL' 1;">add_task</span>
                        完了
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Settings Modal (Hidden by default) -->
    <div id="settings-modal" class="fixed inset-0 z-[60] flex items-center justify-center hidden">
        <!-- Backdrop Overlay -->
        <div id="settings-overlay" class="fixed inset-0 bg-black/40 backdrop-blur-sm transition-opacity">
            <div class="absolute inset-0 bg-pattern opacity-[0.15]"></div>
        </div>
        <!-- Modal Content -->
        <div
            class="relative z-10 bg-surface-container-lowest w-full max-w-lg rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.04)] p-8 overflow-y-auto max-h-[90vh] transition-all duration-300 mx-4 fade-in-up">
            <!-- Left accent -->
            <div class="absolute left-0 top-0 bottom-0 w-1 bg-primary"></div>

            <div class="flex justify-between items-start mb-6">
                <div>
                    <h2 class="font-headline-md text-headline-md text-on-surface">アカウント設定</h2>
                    <p class="font-label-sm text-label-sm text-on-surface-variant mt-1">プロフィールとセキュリティの管理</p>
                </div>
                <button id="close-settings-btn"
                    class="text-on-surface-variant hover:bg-surface-variant p-2 rounded-full transition-colors flex-shrink-0 flex items-center justify-center">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>

            <!-- エラー/成功メッセージ表示エリア -->
            <div id="settings-message" class="hidden mb-4 px-4 py-3 rounded-lg text-label-sm font-label-bold"></div>

            <form id="settings-form" class="space-y-6">
                <!-- 名前（ニックネーム） -->
                <div>
                    <label class="block font-label-bold text-label-bold text-on-surface mb-2" for="settings-name">
                        <span class="material-symbols-outlined text-[18px] align-middle mr-1">person</span>
                        お名前（ニックネーム）
                    </label>
                    <input
                        class="w-full h-12 px-4 rounded-md border border-outline-variant bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow placeholder:text-on-surface-variant/50 font-body-md text-body-md"
                        id="settings-name" placeholder="名前を入力" type="text" />
                </div>

                <!-- メールアドレス（表示のみ） -->
                <div>
                    <label class="block font-label-bold text-label-bold text-on-surface mb-2" for="settings-email">
                        <span class="material-symbols-outlined text-[18px] align-middle mr-1">mail</span>
                        メールアドレス
                    </label>
                    <input
                        class="w-full h-12 px-4 rounded-md border border-outline-variant bg-surface-container text-on-surface-variant cursor-not-allowed font-body-md text-body-md"
                        id="settings-email" type="email" disabled />
                    <p class="text-label-sm text-on-surface-variant mt-1">メールアドレスは変更できません</p>
                </div>

                <!-- 区切り線 -->
                <div class="border-t border-surface-variant"></div>

                <!-- パスワード変更セクション -->
                <div>
                    <h3 class="font-label-bold text-label-bold text-on-surface mb-4">
                        <span class="material-symbols-outlined text-[18px] align-middle mr-1">lock</span>
                        パスワード変更
                    </h3>

                    <div class="space-y-4">
                        <!-- 現在のパスワード -->
                        <!-- 現在のパスワード -->
                        <div>
                            <label class="block font-label-sm text-label-sm text-on-surface-variant mb-1"
                                for="settings-current-password">現在のパスワード</label>
                            <div class="relative">
                                <input
                                    class="w-full h-12 pl-4 pr-12 rounded-md border border-outline-variant bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow placeholder:text-on-surface-variant/50 font-body-md text-body-md"
                                    id="settings-current-password" placeholder="現在のパスワード" type="password" />
                                <!-- ↓ ここからボタンを追加 -->
                                <button type="button"
                                    class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface p-1 flex items-center justify-center rounded-full transition-colors">
                                    <span class="material-symbols-outlined text-[20px]">visibility</span>
                                </button>
                                <!-- ↑ ここまで追加 -->
                            </div>
                        </div>

                        <!-- 新しいパスワード -->
                        <div>
                            <label class="block font-label-sm text-label-sm text-on-surface-variant mb-1"
                                for="settings-new-password">新しいパスワード</label>
                            <div class="relative">
                                <input
                                    class="w-full h-12 pl-4 pr-12 rounded-md border border-outline-variant bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow placeholder:text-on-surface-variant/50 font-body-md text-body-md"
                                    id="settings-new-password" placeholder="英字と数字を含む8文字以上" type="password" />
                                <!-- ↓ ここからボタンを追加 -->
                                <button type="button"
                                    class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface p-1 flex items-center justify-center rounded-full transition-colors">
                                    <span class="material-symbols-outlined text-[20px]">visibility</span>
                                </button>
                                <!-- ↑ ここまで追加 -->
                            </div>
                        </div>

                        <!-- 新しいパスワード（確認） -->
                        <div>
                            <label class="block font-label-sm text-label-sm text-on-surface-variant mb-1"
                                for="settings-confirm-password">新しいパスワード（確認）</label>
                            <div class="relative">
                                <input
                                    class="w-full h-12 pl-4 pr-12 rounded-md border border-outline-variant bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow placeholder:text-on-surface-variant/50 font-body-md text-body-md"
                                    id="settings-confirm-password" placeholder="もう一度入力" type="password" />
                                <!-- ↓ ここからボタンを追加 -->
                                <button type="button"
                                    class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface p-1 flex items-center justify-center rounded-full transition-colors">
                                    <span class="material-symbols-outlined text-[20px]">visibility</span>
                                </button>
                                <!-- ↑ ここまで追加 -->
                            </div>
                        </div>


                    </div>
                </div>

                <!-- 保存ボタン -->
                <div
                    class="flex flex-col sm:flex-row justify-end items-center pt-4 gap-4 border-t border-surface-variant">
                    <button id="settings-cancel-btn"
                        class="w-full sm:w-auto px-6 py-3 rounded-full border-2 border-primary text-primary font-label-bold text-label-bold hover:bg-primary/5 active:scale-95 transition-all duration-200"
                        type="button">
                        キャンセル
                    </button>
                    <button id="settings-save-btn"
                        class="w-full sm:w-auto px-8 py-3 rounded-full bg-primary text-on-primary font-label-bold text-label-bold hover:bg-surface-tint shadow-md hover:shadow-lg active:scale-95 transition-all duration-200 flex items-center justify-center gap-2"
                        type="submit">
                        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">save</span>
                        保存
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>

</html>
