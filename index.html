<body
  class="text-on-background min-h-screen flex items-center justify-center p-4 relative overflow-y-auto overflow-x-hidden"
  style="background: radial-gradient(circle at 15% 25%, rgba(255, 140, 0, 0.15) 0%, transparent 50%), radial-gradient(circle at 85% 75%, rgba(255, 140, 0, 0.12) 0%, transparent 60%), rgb(248, 249, 250);">
  <!-- Auth Card Container -->
  <main class="w-full max-w-[440px] relative z-10">
    <!-- Main Card -->
    <div class="bg-surface rounded-xl shadow-[0_4px_20px_0_rgba(0,0,0,0.04)] p-8 md:p-10 w-full flex flex-col gap-6">
      <!-- Header Section -->
      <div class="text-center mb-2">
        <h1 class="font-display text-display text-primary tracking-tight mb-2"><span style="font-family: 'Yuji Syuku', serif;">威風</span><span style="font-family: 'Yusei Magic', sans-serif;">とぅどぅ</span></h1>
      </div>
      <!-- Form Section -->
      <form class="flex flex-col gap-5">
        <!-- Email Input -->
        <div class="flex flex-col gap-2">
          <label class="font-label-bold text-label-bold text-on-surface" for="email">メールアドレス</label>
          <input
            class="w-full bg-surface-container-lowest border border-outline-variant rounded-md px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all shadow-sm"
            id="email" placeholder="you@example.com" required="" type="email">
        </div>
        <!-- Password Input -->
        <div class="flex flex-col gap-2">
          <div class="flex justify-between items-center">
            <label class="font-label-bold text-label-bold text-on-surface" for="password">パスワード</label>

          </div>
          <div class="relative">
            <input
              class="w-full bg-surface-container-lowest border border-outline-variant rounded-md px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all shadow-sm"
              id="password" placeholder="••••••••" required="" type="password">
            <button type="button"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface p-1 flex items-center justify-center rounded-full transition-colors">
              <span class="material-symbols-outlined text-[20px]">visibility</span>
            </button>
          </div>
          <div class="text-right mt-2"><a
              class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors"
              href="#">パスワードをお忘れですか？</a></div>
        </div>
        <!-- Login Button -->
        <button
          class="w-full bg-primary-container text-on-primary-container font-label-bold text-label-bold py-3.5 rounded-lg shadow-sm hover:scale-[1.02] hover:shadow-md transition-all duration-200 mt-2 flex items-center justify-center gap-2 group"
          type="submit">
          <span class="">ワークスペースにログイン</span>
          <span
            class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
        </button>
      </form>
      <!-- Divider -->
      <div class="flex items-center gap-4 my-2">
        <div class="flex-grow border-t border-surface-variant"></div>
        <span class="font-label-sm text-label-sm text-outline">または次でログイン</span>
        <div class="flex-grow border-t border-surface-variant"></div>
      </div>
      <!-- Social Login -->
      <button id="google-login-btn"
        class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-label-bold text-label-bold py-3.5 rounded-lg shadow-sm hover:bg-surface-container-low transition-colors flex items-center justify-center gap-3"
        type="button">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
            fill="#4285F4"></path>
          <path
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
            fill="#34A853"></path>
          <path
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
            fill="#FBBC05"></path>
          <path
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
            fill="#EA4335"></path>
        </svg>
        <span class="">Googleでサインイン</span>
      </button>
    </div>
    <!-- Footer / Create Account -->
    <div class="mt-8 text-center">
      <p class="font-body-lg text-body-lg text-on-surface-variant">
        <span style="font-family: 'Yuji Syuku', serif;">威風</span><span style="font-family: 'Yusei Magic', sans-serif;">とぅどぅ</span>は初めてですか？
        <a class="font-bold text-primary hover:text-primary-container transition-colors ml-1"
          href="register.html">アカウントを作成</a>
      </p>
    </div>
  </main>

  <script type="module" src="index.js"></script>
</body>
