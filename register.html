<!DOCTYPE html>
<html lang="ja" style="">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>アカウント作成</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error": "#ffffff",
                        "surface": "#f8f9fa",
                        "secondary-fixed-dim": "#ffb77c",
                        "on-background": "#191c1d",
                        "on-secondary-fixed": "#2f1500",
                        "outline": "#897362",
                        "tertiary-fixed": "#c7e7ff",
                        "surface-container-low": "#f2f4f5",
                        "primary-fixed-dim": "#ffb77d",
                        "surface-container-high": "#e7e8e9",
                        "secondary-container": "#fca558",
                        "primary": "#904d00",
                        "surface-pure": "#FFFFFF",
                        "surface-container-lowest": "#ffffff",
                        "surface-dim": "#d8dadb",
                        "on-secondary-fixed-variant": "#6e3900",
                        "on-surface": "#191c1d",
                        "on-tertiary": "#ffffff",
                        "surface-variant": "#e1e3e4",
                        "surface-tint": "#904d00",
                        "error-container": "#ffdad6",
                        "surface-alt": "#F3F4F5",
                        "on-error-container": "#93000a",
                        "on-tertiary-container": "#004360",
                        "primary-fixed": "#ffdcc3",
                        "surface-bright": "#f8f9fa",
                        "tertiary": "#00658f",
                        "on-secondary": "#ffffff",
                        "outline-variant": "#ddc1ae",
                        "on-primary-fixed-variant": "#6e3900",
                        "surface-container": "#eceeef",
                        "on-primary-fixed": "#2f1500",
                        "secondary": "#904d00",
                        "tertiary-fixed-dim": "#85cfff",
                        "inverse-surface": "#2e3132",
                        "primary-container": "#ff8c00",
                        "on-primary-container": "#623200",
                        "background": "#f8f9fa",
                        "error": "#ba1a1a",
                        "on-tertiary-fixed-variant": "#004c6c",
                        "on-primary": "#ffffff",
                        "surface-container-highest": "#e1e3e4",
                        "tertiary-container": "#00b5fc",
                        "on-surface-variant": "#564334",
                        "on-secondary-container": "#713b00",
                        "secondary-fixed": "#ffdcc3",
                        "inverse-on-surface": "#eff1f2",
                        "inverse-primary": "#ffb77d",
                        "on-tertiary-fixed": "#001e2e"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "base": "8px",
                        "margin-desktop": "40px",
                        "stack-md": "12px",
                        "stack-sm": "4px",
                        "container-max": "1280px",
                        "margin-mobile": "20px",
                        "stack-lg": "24px"
                    },
                    "fontFamily": {
                        "body-lg": [
                            "Plus Jakarta Sans"
                        ],
                        "body-md": [
                            "Plus Jakarta Sans"
                        ],
                        "headline-lg": [
                            "Plus Jakarta Sans"
                        ],
                        "label-md": [
                            "Plus Jakarta Sans"
                        ],
                        "label-sm": [
                            "Plus Jakarta Sans"
                        ],
                        "headline-md": [
                            "Plus Jakarta Sans"
                        ],
                        "headline-xl": [
                            "Plus Jakarta Sans"
                        ],
                        "headline-lg-mobile": [
                            "Plus Jakarta Sans"
                        ]
                    },
                    "fontSize": {
                        "body-lg": [
                            "18px",
                            {
                                "lineHeight": "28px",
                                "fontWeight": "400"
                            }

                        "body-md": [
                            "16px",
                            {
                                "lineHeight": "24px",
                                "fontWeight": "400"
                            }
                        ],
                        "headline-lg": [

                        "label-md": [
                            "14px",
                            {

                                "letterSpacing": "0.01em",
                                "fontWeight": "600"
                            }
                        ],
                        "label-sm": [
                            "12px",
                            {
                                "lineHeight": "16px",
                                "letterSpacing": "0.05em",
                                "fontWeight": "700"
                            }
                        ],
                        "headline-md": [
                            "24px",
                            {

                                "fontWeight": "600"
                            }
                        ],
                        "headline-xl": [

                                "letterSpacing": "-0.02em",

    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>

<body
    class="text-on-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md"
    style="background: radial-gradient(circle at 15% 25%, rgba(255, 140, 0, 0.15) 0%, transparent 50%), radial-gradient(circle at 85% 75%, rgba(255, 140, 0, 0.12) 0%, transparent 60%), rgb(248, 249, 250);">
    <main
        class="w-full max-w-[480px] bg-surface-container-lowest rounded-xl shadow-[0px_4px_12px_rgba(0,0,0,0.05)] border border-outline-variant/30 overflow-hidden relative">
        <div class="p-gutter pt-gutter">
            <div class="mb-gutter text-center">
                <h2 class="font-headline-lg text-headline-lg text-on-surface mb-base hidden md:block">アカウント作成</h2>
                <h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-base md:hidden">アカウント作成
                </h2>
                <p class="font-body-md text-body-md text-on-surface-variant">さあ、タスクを始めましょう。</p>
            </div>
            <form class="space-y-gutter">
                <div class="space-y-stack-sm">
                    <label class="font-label-sm text-label-sm text-on-surface-variant block"
                        for="fullName">お名前（ニックネーム）</label>
                    <input
                        class="w-full bg-surface-container-lowest border border-outline rounded-lg px-gutter py-stack-md font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-shadow"
                        id="fullName" name="fullName" placeholder="山田 太郎" type="text">
                </div>
                <div class="space-y-stack-sm">
                    <label class="font-label-sm text-label-sm text-on-surface-variant block" for="email">メールアドレス</label>
                    <input
                        class="w-full bg-surface-container-lowest border border-outline rounded-lg px-gutter py-stack-md font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-shadow"
                        id="email" name="email" placeholder="mail@example.com" type="email">
                </div>
                <div class="space-y-stack-sm">
                    <div class="flex justify-between items-center">
                        <label class="font-label-sm text-label-sm text-on-surface-variant block"
                            for="password">パスワード(英数字を含む8文字以上で入力)</label>
                    </div>
                    <div class="relative">
                        <input
                            class="w-full bg-surface-container-lowest border border-outline rounded-lg px-gutter py-stack-md font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-shadow"
                            id="password" name="password" placeholder="••••••••" type="password">
                        <button
                            class="absolute inset-y-0 right-0 pr-gutter flex items-center text-on-surface-variant hover:text-primary transition-colors"
                            type="button">
                            <span class="material-symbols-outlined" data-icon="visibility">visibility</span>
                        </button>
                    </div>
                </div>
                <div class="space-y-stack-sm">
                    <div class="flex justify-between items-center">
                        <label class="font-label-sm text-label-sm text-on-surface-variant block"
                            for="confirmPassword">パスワード再確認</label>
                    </div>
                    <div class="relative">
                        <input
                            class="w-full bg-surface-container-lowest border border-outline rounded-lg px-gutter py-stack-md font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-shadow"
                            id="confirmPassword" name="confirmPassword" placeholder="••••••••" type="password">
                        <button
                            class="absolute inset-y-0 right-0 pr-gutter flex items-center text-on-surface-variant hover:text-primary transition-colors"
                            type="button">
                            <span class="material-symbols-outlined" data-icon="visibility">visibility</span>
                        </button>
                    </div>
                </div>
                <button
                    class="w-full bg-primary-container text-on-primary-container font-label-md text-label-md rounded-lg py-stack-md px-gutter hover:bg-primary hover:text-on-primary transition-colors flex items-center justify-center gap-base mt-gutter"
                    type="submit">
                    <span class="">アカウントを作成</span>
                    <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
                </button>
            </form>
            <div class="mt-gutter relative flex items-center justify-center">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-outline-variant"></div>
                </div>
                <div
                    class="relative bg-surface-container-lowest px-gutter font-label-sm text-label-sm text-on-surface-variant">
                    または
                </div>
            </div>
            <div class="mt-gutter">
                <button
                    class="w-full bg-surface-container-lowest border border-outline text-on-surface font-label-md text-label-md rounded-lg py-stack-md px-gutter hover:bg-surface-container-low transition-colors flex items-center justify-center gap-stack-md"
                    type="button">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                            fill="#4285F4"></path>
                        <path
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                            fill="#34A853"></path>
                        <path
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                            fill="#FBBC05"></path>
                        <path
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                            fill="#EA4335"></path>
                    </svg>
                    Googleで新規登録
                </button>
            </div>
            <div class="mt-gutter text-center flex flex-col gap-stack-md">
                <p class="font-body-md text-body-md text-on-surface-variant">
                    すでにアカウントをお持ちですか？ <a class="font-label-md text-label-md text-primary hover:underline"
                        href="index.html">ログイン</a>
                </p>
            </div>
        </div>
    </main>
    <!-- HTMLの末尾付近 -->
    <script type="module" src="register.js"></script>
</body>

</html>
