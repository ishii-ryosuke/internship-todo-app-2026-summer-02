<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>SparkDo - 下書き</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#904d00", "background": "#f8f9fa", "surface-dim": "#d9dadb",
                        "on-primary": "#ffffff", "outline-variant": "#ddc1ae", "surface-variant": "#e1e3e4",
                        "surface-container-low": "#f3f4f5", "primary-fixed": "#ffdcc3", "error": "#ba1a1a",
                        "inverse-on-surface": "#f0f1f2", "on-background": "#191c1d", "error-container": "#ffdad6",
                        "on-secondary-container": "#686256", "secondary-container": "#e8ded0", "surface": "#f8f9fa",
                        "tertiary-container": "#a4abad", "secondary": "#645e52", "on-error-container": "#93000a",
                        "primary-container": "#ff8c00", "on-surface": "#191c1d", "surface-container-lowest": "#ffffff",
                        "inverse-surface": "#2e3132", "secondary-fixed": "#ebe1d3", "on-primary-container": "#623200",
                        "surface-tint": "#904d00", "tertiary-fixed": "#dde4e6", "tertiary": "#586062",
                        "outline": "#897362", "on-secondary-fixed": "#1f1b12", "surface-container-highest": "#e1e3e4",
                        "surface-bright": "#f8f9fa", "on-primary-fixed-variant": "#6e3900",
                        "inverse-primary": "#ffb77d", "surface-container-high": "#e7e8e9", "on-secondary": "#ffffff",
                        "on-surface-variant": "#564334", "secondary-fixed-dim": "#cec5b7",
                        "primary-fixed-dim": "#ffb77d", "on-tertiary": "#ffffff", "on-error": "#ffffff",
                        "surface-container": "#edeeef"
                    },
                    "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                    "spacing": { "container-max": "1120px", "md": "24px", "gutter": "24px", "lg": "48px", "sm": "12px", "xs": "4px", "xl": "80px", "base": "8px" },
                    "fontFamily": { "body-lg": ["Plus Jakarta Sans"], "display": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "headline-lg-mobile": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"], "label-bold": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"] },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "display": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "label-bold": ["14px", { "lineHeight": "20px", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .task-card-shadow {
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.04);
        }

        .custom-checkbox-fill {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .custom-checkbox-container input:checked~.custom-checkbox-fill {
            background-color: #904d00;
            border-color: #904d00;
        }

        .custom-checkbox-container input:checked~.custom-checkbox-fill span {
            opacity: 1;
            transform: scale(1);
        }

        .select-all-active {
            background-color: #904d00 !important;
            border-color: #904d00 !important;
        }

        .select-all-active span {
            opacity: 1 !important;
            transform: scale(1) !important;
        }

        .fade-in-up {
            animation: fadeInUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body
    class="bg-gradient-to-br from-background to-secondary-container min-h-screen text-on-background font-body-md antialiased flex flex-col">

    <!-- TopAppBar -->
    <header class="bg-surface dark:bg-background shadow-sm docked full-width top-0 sticky z-50">
        <div class="flex justify-between items-center px-gutter w-full h-16 max-w-container-max mx-auto">
            <div class="flex items-center gap-sm">
                <a href="main.html" aria-label="戻る"
                    class="p-2 rounded-full hover:bg-surface-variant transition-colors text-on-surface-variant flex items-center justify-center">
                    <span class="material-symbols-outlined text-[24px]">arrow_back</span>
                </a>
                <span
                    class="font-display text-[20px] font-bold text-primary dark:text-primary-fixed-dim tracking-tight">威風とぅどぅ</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 w-full max-w-container-max mx-auto px-gutter py-lg flex flex-col gap-lg">

        <!-- Header -->
        <section class="flex flex-col gap-xs">
            <div class="flex items-center gap-sm">
                <span class="material-symbols-outlined text-[32px] text-tertiary">draft</span>
                <h1 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-background">下書き</h1>
            </div>
            <p class="font-body-md text-body-md text-on-surface-variant">作成途中のタスクがここに保存されます。</p>
        </section>

        <!-- Bulk Actions Bar -->
        <section
            class="bg-surface/80 backdrop-blur-md rounded-xl shadow-[0_4px_20px_0_rgba(0,0,0,0.04)] p-sm md:p-md flex items-center justify-between sticky top-[80px] z-40 border border-outline-variant/30">
            <label class="flex items-center gap-sm cursor-pointer group select-none">
                <input class="sr-only" id="selectAllCheckbox" type="checkbox">
                <div class="relative w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center group-hover:border-primary transition-colors custom-checkbox-fill"
                    id="selectAllVisual">
                    <span
                        class="material-symbols-outlined text-on-primary text-[16px] opacity-0 scale-50 transition-all duration-200"
                        style="font-variation-settings: &quot;wght&quot; 600;">check</span>
                </div>
                <span class="font-label-bold text-label-bold text-on-surface" id="selectAllLabel">全選択</span>
            </label>

            <div class="flex gap-sm transition-all duration-300 opacity-50 pointer-events-none translate-y-1"
                id="bulkActionsPanel">
                <button id="bulkTrashBtn" type="button"
                    class="px-4 py-2 rounded-lg border border-outline text-on-surface-variant font-label-bold text-label-bold hover:bg-surface-variant active:scale-95 transition-all flex items-center gap-xs">
                    <span class="material-symbols-outlined text-[18px]">delete</span>
                    <span class="hidden md:inline">ゴミ箱へ送る</span>
                </button>
                <button id="bulkDeleteBtn" type="button"
                    class="px-4 py-2 rounded-lg bg-error text-on-error font-label-bold text-label-bold hover:bg-error/90 active:scale-95 transition-all shadow-sm flex items-center gap-xs">
                    <span class="material-symbols-outlined text-[18px]">delete_forever</span>
                    <span class="hidden md:inline">完全削除</span>
                </button>
            </div>
        </section>

        <!-- Task List -->
        <section class="flex flex-col gap-md pb-xl" id="taskList">
            <div id="empty-state"
                class="flex flex-col items-center justify-center py-xl gap-md text-on-surface-variant opacity-60">
                <span class="material-symbols-outlined text-[64px]">draft</span>
                <p class="font-body-lg">下書きはありません</p>
            </div>
        </section>

    </main>

    <!-- Permanent Delete Confirmation Modal -->
    <div id="delete-modal" class="fixed inset-0 z-[60] flex items-center justify-center hidden" role="dialog"
        aria-modal="true" aria-labelledby="delete-modal-title">
        <div id="delete-modal-overlay" class="fixed inset-0 bg-black/40 backdrop-blur-sm transition-opacity"></div>
        <div class="relative z-10 w-full max-w-md px-gutter mx-4">
            <div
                class="bg-surface-container-lowest rounded-2xl p-6 md:p-8 shadow-2xl text-center fade-in-up border border-surface-variant/50">
                <div
                    class="w-14 h-14 mx-auto rounded-full bg-error-container text-error flex items-center justify-center mb-4">
                    <span class="material-symbols-outlined text-[32px]">delete_forever</span>
                </div>
                <h2 id="delete-modal-title"
                    class="font-headline-md text-on-surface font-bold text-xl md:text-2xl tracking-tight mb-2">
                    完全に削除しますか？</h2>
                <p id="delete-modal-message" class="text-on-surface-variant font-body-md text-sm md:text-base mb-6">
                    選択した下書きを完全削除しますか？この操作は取り消せません。</p>
                <div class="flex flex-col-reverse sm:flex-row gap-3">
                    <button id="delete-modal-cancel-btn" type="button"
                        class="w-full py-3 px-5 rounded-full bg-surface-container hover:bg-surface-container-high text-on-surface font-label-bold transition-all duration-200">キャンセル</button>
                    <button id="delete-modal-confirm-btn" type="button"
                        class="w-full py-3 px-5 rounded-full bg-error hover:bg-error/90 text-on-error font-label-bold shadow-md hover:shadow-lg transition-all duration-200 flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined text-[18px]">delete_forever</span>削除
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Task Modal -->
    <div id="edit-task-modal" class="fixed inset-0 z-[60] flex items-center justify-center hidden">
        <div id="edit-task-overlay" class="fixed inset-0 bg-black/40 backdrop-blur-sm transition-opacity"></div>
        <div
            class="relative z-10 bg-surface-container-lowest w-full max-w-2xl rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.04)] p-8 overflow-hidden transition-all duration-300 mx-4">
            <div class="absolute left-0 top-0 bottom-0 w-1 bg-primary"></div>
            <div class="mb-8">
                <h2 class="font-headline-md text-headline-md text-on-surface mb-2">下書きの編集</h2>
            </div>
            <form id="edit-task-form" class="space-y-6">
                <!-- Due Date, Tag & Priority -->
                <div>
                    <div class="flex justify-between items-end mb-2">
                        <label class="block font-label-bold text-label-bold text-on-surface" for="editTaskDueDate">
                            <span class="material-symbols-outlined text-[18px] align-middle mr-1">calendar_today</span>
                            期限
                        </label>
                        <div class="flex items-center gap-3">
                            <label class="block font-label-bold text-label-sm text-on-surface-variant text-xs" for="editTagBtn">タグ</label>
                            <label class="block font-label-bold text-label-sm text-on-surface" for="editPriorityBtn">優先度</label>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <input
                            class="flex-grow h-12 px-4 rounded-md border border-outline-variant bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow font-body-md text-body-md"
                            id="editTaskDueDate" type="date" />
                        <button aria-label="Toggle tag"
                            class="h-8 px-3 rounded-full bg-surface-variant border border-outline-variant flex-shrink-0 transition-colors duration-300 text-[10px] font-bold text-on-surface-variant hover:bg-surface-container"
                            id="editTagBtn" type="button">就活</button>
                        <button aria-label="Toggle priority"
                            class="w-8 h-8 rounded-full bg-green-500 flex-shrink-0 transition-colors duration-300 text-[10px] font-bold text-[#FFFFFF]"
                            id="editPriorityBtn" type="button">低</button>
                    </div>
                </div>
                <!-- Task Name -->
                <div>
                    <label class="block font-label-bold text-label-bold text-on-surface mb-2"
                        for="editTaskName">タスク名</label>
                    <input
                        class="w-full h-12 px-4 rounded-md border border-outline-variant bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow placeholder:text-on-surface-variant/50 font-body-md text-body-md"
                        id="editTaskName" placeholder="例：プロジェクトの進捗確認" type="text" required />
                </div>
                <div>
                    <label class="block font-label-bold text-label-bold text-on-surface mb-2"
                        for="editTaskContent">内容</label>
                    <textarea
                        class="w-full p-4 rounded-md border border-outline-variant bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow placeholder:text-on-surface-variant/50 font-body-md text-body-md resize-y"
                        id="editTaskContent" placeholder="タスクの詳細を記入してください..." rows="5"></textarea>
                </div>
                <div
                    class="flex flex-col sm:flex-row justify-end items-center pt-6 gap-4 border-t border-surface-variant">
                    <button id="cancel-edit-btn"
                        class="w-full sm:w-auto px-6 py-3 rounded-full border-2 border-primary text-primary font-label-bold text-label-bold hover:bg-primary/5 active:scale-95 transition-all duration-200"
                        type="button">キャンセル</button>
                    <button id="draft-save-btn"
                        class="w-full sm:w-auto px-6 py-3 rounded-full bg-secondary-container text-on-secondary-container font-label-bold text-label-bold hover:bg-secondary-fixed active:scale-95 transition-all duration-200"
                        type="button">下書き保存</button>
                    <button
                        class="w-full sm:w-auto px-8 py-3 rounded-full bg-primary text-on-primary font-label-bold text-label-bold hover:bg-surface-tint shadow-md hover:shadow-lg active:scale-95 transition-all duration-200 flex items-center justify-center gap-2"
                        type="submit">
                        <span class="material-symbols-outlined"
                            style="font-variation-settings: 'FILL' 1;">add_task</span>完了
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="draft.js"></script>

</body>

</html>
